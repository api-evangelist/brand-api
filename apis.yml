description: >-
  Brandfetch provides programmatic access to brand assets and company data through
  a suite of APIs. The Brand API retrieves logos, color schemes, fonts, images, and
  firmographic information for any company via domain, stock ticker, ISIN code, or
  crypto symbol. The Logo Link API serves logos via CDN with support for multiple
  formats, themes, and sizes. The Brand Search API enables autocomplete experiences
  by matching brand names to their domains and identifiers. The Brand Context API
  returns an LLM-ready narrative profile — identity, positioning, voice and visual
  style — for grounding agents, and the Transaction API resolves raw payment
  descriptors into merchant identity. A hosted MCP server at mcp.brandfetch.io
  exposes the same capabilities as seven agent tools over OAuth, and an Enterprise
  GraphQL endpoint carries the account, webhook and brand-monitoring plane. REST
  authenticates with Bearer API keys; the Logo and Search APIs use a public,
  embeddable Client ID.
apis:
- aid: brand-api:brandfetch-mcp
  name: Brandfetch MCP Server
  description: >-
    Hosted, remote, streamable-HTTP MCP server exposing seven Brandfetch tools — brand_search, get_brand,
    get_brand_context, enrich_transaction, build_logo_urls, get_asset_base64 and send_feedback — to any
    MCP client. Authenticates with OAuth 2.1 (authorization_code + PKCE S256) or a bf1. bearer token.
    MCP requests draw on the caller's Brand API quota.
  humanURL: https://docs.brandfetch.com/mcp/overview
  baseURL: https://mcp.brandfetch.io/mcp
  tags:
  - MCP
  - Agent Tools
  - Brands
  properties:
  - type: MCPServer
    url: mcp/brand-api-mcp.yml
  - type: ToolCrosswalk
    url: mcp/brand-api-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.brandfetch.com/mcp/overview
  - type: SourceCode
    url: https://github.com/Brandfetch/brandfetch-mcp-server
- aid: brand-api:brandfetch-graphql
  name: Brandfetch GraphQL API
  description: >-
    Enterprise GraphQL endpoint carrying the account plane the REST API does not expose — organizations,
    API keys, request logs, quotas, billing, webhook registration and delivery history, the industry/geography
    taxonomy, and the Brand Police trademark-monitoring surface. Anonymous introspection is open and returned
    the full 161-type schema on 2026-08-14; query execution is Enterprise-gated.
  humanURL: https://docs.brandfetch.com/delivery-methods/graphql
  baseURL: https://graphql.brandfetch.io
  tags:
  - GraphQL
  - Account Management
  - Webhook
  tags_raw:
