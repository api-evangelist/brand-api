- aid: brand-api:brandfetch-logo-link-api
  name: Brandfetch Logo Link API
  tags:
  - Logos
  - CDN
  - Brand Assets
  humanURL: https://docs.brandfetch.com/logo-api/overview
  baseURL: https://cdn.brandfetch.io
  properties:
  - url: https://docs.brandfetch.com/logo-api/overview
    type: Documentation
  - url: https://docs.brandfetch.com/logo-api/parameters
    type: APIReference
  description: >-
    Logo Link delivers brand logos directly via CDN URL embedding. Supports lookup by domain, stock ticker,
    crypto symbol, or ISIN. Parameters include logo type (icon, symbol, logo), theme (light/dark), height/width,
    format (webp, png, jpg, svg), and fallback behavior. Base CDN URL: https://cdn.brandfetch.io/{identifier}?c=CLIENT_ID.
    Free with fair-use rate limits; no attribution required. It is a CDN URL contract rather than a REST
    resource, which is why it carries no OpenAPI representation.
- aid: brand-api:brandfetch-brand-search-api
  name: Brandfetch Brand Search API
  tags:
  - Brand Search
  - Autocomplete
  - Domain Matching
  humanURL: https://docs.brandfetch.com/brand-search-api/overview
  baseURL: https://api.brandfetch.io/v2
  properties:
  - url: https://docs.brandfetch.com/brand-search-api/overview
    type: Documentation
  - url: https://docs.brandfetch.com/reference/brand-search-api
    type: APIReference
  description: >-
    Brand Search API matches brand names to their corresponding domain URLs and unique identifiers, enabling
    rich autocomplete experiences. Endpoint: GET https://api.brandfetch.io/v2/search/:name. Authentication
    via Client ID query parameter. Free to use; no attribution required. Logo URLs it returns expire after
    24 hours and must not be cached.
