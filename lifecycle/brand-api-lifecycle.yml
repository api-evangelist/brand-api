    Every REST path is prefixed /v2. The OpenAPI's own info.version is 1.0.0 and does not
    track the URI version. No version header, no date-pinned version train.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    Brandfetch publishes NO deprecation policy and no RFC 8594 Sunset/Deprecation header
    support. The one deprecation actually performed — the bare auto-detect route
    /v2/brands/{identifier} being superseded by explicit /domain/, /ticker/, /isin/ and
    /crypto/ routes in December 2025 — was announced only as a changelog "we recommend"
    and the old route still works. It is labelled "Auto-detection (legacy)" in the docs
    but is NOT marked `deprecated: true` in the OpenAPI.
  soft_deprecations:
    - operation: getBrandData
      path: /v2/brands/{identifier}
      status: legacy-but-supported
      superseded_by: [getBrandDataByDomain, getBrandDataByTicker, getBrandDataByIsin, getBrandDataByCrypto]
      announced: '2025-12'
      source: https://docs.brandfetch.com/changelog/overview
