}

enum RadarStatus {
  """The Radar was just created and the system hasn't begun processing it yet."""
  PENDING
  """The search for similar images is in progress."""
  SEARCH_IN_PROGRESS
  """We've finished searching for and analyzing images."""
  SEARCH_COMPLETED
  """For some reason, there was a problem during search & analysis."""
  SEARCH_FAILED
  """There is an open/ongoing 'take down' action in progress for one or more of the Radar's Hits."""
  ACTION_IN_PROGRESS
}

"""
A class of HTTP response status, for filtering a request log. A class covers a
whole range rather than an exact code, so `CLIENT_ERROR` matches any 4xx.
"""
enum RequestLogStatus {
  """2xx — the request succeeded."""
  SUCCESS
  """3xx — the request was redirected."""
  REDIRECT
  """4xx — the request was rejected; the caller's to fix."""
  CLIENT_ERROR
  """5xx — the request failed on our side."""
  SERVER_ERROR
}

