"""
One fulfilled API request, normalized across the REST and GraphQL APIs. Fields
that do not apply to the API that served a given request are `null` rather than
omitted, so every entry has the same shape.
"""
type ApiRequestLog {
  id: ID!
  """
  When the request was recorded, which trails the request itself by a few seconds
and occasionally longer. Treat it as approximate.
  """
  timestamp: DateTime!
  """The API key the request authenticated as."""
  apiKey: URN
  """
  Name of that API key at the time of reading. Included because the log covers
revoked keys too, and those are absent from `Organization.apiKeys` — so
requests made with a rotated key stay attributed.
  """
  apiKeyName: String
  """The service that served the request — `rest-api` or `graphql-api`."""
  service: String!
  """HTTP method. Null for GraphQL requests."""
  method: String
  """Request path. Null for GraphQL requests."""
  path: String
  """Root GraphQL field. Null for REST requests."""
  fieldName: String
  """HTTP status. Null for GraphQL requests, which do not publish one."""
  statusCode: Int
  userAgent: String
  ip: String
}

"""An ApiRequestLog edge"""
type ApiRequestLogEdge {
  """A cursor for use in pagination."""
  cursor: ID!
  """The ApiRequestLog at the end of edge."""
  node: ApiRequestLog!
}

"""
An ApiRequestLogs connection.
This connection has no `totalCount`. Page through it to read the log, and use
the usage figures on `ApiKey.usage` for request totals.
"""
type ApiRequestLogsConnection {
  """A list of node edges"""
  edges: [ApiRequestLogEdge!]!
  """A list of nodes"""
  nodes: [ApiRequestLog!]!
  """Information for pagination"""
  pageInfo: PageInfo!
}

