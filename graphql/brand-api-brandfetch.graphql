"""
Narrows a webhook's delivery history to a time window.
Both bounds apply to `WebhookDelivery.createdAt`, the time the delivery was
recorded and the order the history is returned in. They do not apply to
`deliveredAt`, which is null while a delivery is pending and can be later than
`createdAt` when a delivery was retried.
"""
input WebhookDeliveryFilter {
  """Inclusive lower bound. Omit to start at the oldest delivery still retained."""
  from: DateTime
  """Inclusive upper bound. Omit to end at the newest delivery."""
  to: DateTime
}

input WebhooksFilter {
  """Filter by enabled status"""
  enabled: Boolean
  """Filter by delivery status"""
  deliveryStatus: WebhookDeliveryStatus
}

