"""Root mutation fields"""
type Mutation {
  """Brand Police"""
  brandPolice: BrandPoliceMutation!
  """Request an asynchronous data fetching & processing of the given brand. If provided, once the process is complete, the callback URL will be called with the brand data."""
  requestBrand(domain: FQDN!, callback: URL): RequestBrandMutationResult!
  """Request an asynchronous refresh (re-indexing) of the given brand. If provided, once the refresh is complete, the callback URL will be called with the updated brand data. A brand that was crawled within the past 24 hours cannot be refreshed again yet: the request is rejected with `success: false` and the code `recentlyCrawled`."""
  requestRefresh(brand: URN!, callback: URL): RequestRefreshMutationResult!
  """Creates and activates a new webhook"""
  createWebhook(input: CreateWebhookInput!): WebhookMutationResult!
  """Update the configuration of an existing webhook"""
  updateWebhook(webhook: URN!, input: UpdateWebhookInput!): WebhookMutationResult!
  """Deactivates and removes a webhook"""
  deleteWebhook(webhook: URN!): WebhookMutationResult!
  """
  Subscribe a webhook to the given URN.
This adds the URN to the scope list of URNs that the webhook will be notified about.
For example, passing the URN of a brand will cause the webhook to be notified of all changes to that brand.
  """
  addWebhookSubscriptions(webhook: URN!, subscriptions: [URN!]!): WebhookMutationResult!
  """
  Unsubscribe a webhook from the given URN.
This removes the URN from the scope list of URNs that the webhook will be notified about.
  """
  removeWebhookSubscriptions(webhook: URN!, subscriptions: [URN!]!): WebhookMutationResult!
  createCheckoutLink(organization: URN!, input: CreateCheckoutLinkInput!): URL!
  createBillingPortalLink(organization: URN!): URL!
  updateBillingPreferences(organization: URN!, input: UpdateBillingPreferencesInput!): OrganizationMutationResult!
  """
  Updates the authenticated user's own profile. A field that is omitted or `null` keeps its
current value; at least one field must be provided. Requires a user session — an API key
cannot act on a profile.
  """
  updateProfile(input: UpdateProfileInput!): UserMutationResult!
  """
  Permanently deletes the authenticated user's own account. This removes their sign-in
credentials, removes them from every organization they share with other members, and requests
deletion of any organization where they were the only member — which is processed
asynchronously and cascades to all associated data (billing records, API keys, clients,
webhooks, and so on).
If the user is the only member of an organization that cannot be deleted (it has termination
protection or is on a custom/enterprise plan), the request is rejected and nothing is changed.
  """
  deleteAccount: UserMutationResult!
  removeUserFromOrganization(organization: URN!, user: URN!): OrganizationMutationResult!
  sendInvitation(organization: URN!, input: SendInvitationInput!): InvitationMutationResult!
  acceptInvitation(invitation: URN!): InvitationMutationResult!
  deleteInvitation(invitation: URN!): InvitationMutationResult!
  createOrganization(input: CreateOrganizationInput!): OrganizationMutationResult!
  updateOrganization(organization: URN!, input: UpdateOrganizationInput!): OrganizationMutationResult!
  """
  Records the Google Analytics ids of the visit this organization grew out of.
First touch wins: once recorded the pair is never overwritten, so the dashboard can
send this on every sign-in. The ids are read back when a checkout link is created,
which is what attributes a purchase to the campaign that brought the organization
in — even when the member who buys is not the member who signed up.
  """
  recordOrganizationAttribution(organization: URN!, input: RecordOrganizationAttributionInput!): OrganizationMutationResult!
  """Requests deletion of the organization. Deletion is processed asynchronously and, once complete, permanently removes the organization and all of its associated data (API keys, clients, members, invitations, billing, webhooks, etc.)."""
