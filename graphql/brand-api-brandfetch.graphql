"""
One Logo CDN request. Every field but `id` is nullable — a log line carries only
what the request itself provided — and the brand and geo details are best-effort,
derived from the requested path and the client IP.
"""
type LogoCdnRequestLog {
  id: ID!
  """
  When the request was served. Nullable, unlike `ApiRequestLog.timestamp`: a log
line that does not carry a usable time is reported as `null` rather than given
an invented one.
  """
  timestamp: DateTime
  """The API client whose client id signed the request."""
  apiClient: URN
  """
  Name of that API client at the time of reading. Included because the log covers
revoked clients too, and those are absent from `Organization.apiClients`.
  """
  apiClientName: String
  """The requested CDN path."""
  path: String
  """Brand domain (or asset id) the request resolved to."""
  domain: String
  """Asset kind — `logo`, `icon`, `symbol`, …"""
  assetType: String
  """Delivered image format — `webp`, `png`, `svg`, …"""
  format: String
  statusCode: Int
  """Response size in bytes."""
  bytes: Int
  """Edge cache outcome — `Hit`, `Miss`, `RefreshHit`, `Error`, …"""
  cacheResult: String
  """Domain of the referring page, when the request sent a `Referer`."""
  referer: String
  userAgent: String
  ip: String
  """
  Two-letter country the request came from, resolved from the client IP. A
`String` rather than the `CountryCode` scalar, because an unrecognized value is
reported as-is instead of failing the page.
  """
  countryCode: String
}

