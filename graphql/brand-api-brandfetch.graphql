  createApiKey(organization: URN!, input: ApiKeyInput!): ApiKeyMutationResult!
  updateApiKey(apiKey: URN!, input: ApiKeyInput!): ApiKeyMutationResult!
  deleteApiKey(apiKey: URN!): ApiKeyMutationResult!
  createApiClient(organization: URN!, input: ApiClientInput!): ApiClientMutationResult!
