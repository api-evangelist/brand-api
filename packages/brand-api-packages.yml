note: >-
  Brandfetch publishes no first-party REST client SDK for any mainstream language.
  What it does ship first-party is an official n8n community node on npm, an official
  MCP server (source-only, self-hosted via Docker — no npm/PyPI package), and a Sketch
  plugin. npm, PyPI, RubyGems, crates.io, NuGet, Maven Central and pkg.go.dev were all
  checked for a `brandfetch` client library and none is published by the vendor; the
  third-party packages found on npm (`@keystrokehq/brandfetch`, `@krandfetch/brandfetch`,
  `@pipedream/brandfetch`, `brandfetch-mcp-server` by Eyalm321) are community work and
  are deliberately NOT listed as official.
