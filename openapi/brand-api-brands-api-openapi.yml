          - **Not set** (default) — Some NSFW brands are not returned (`404`), others are returned with `isNsfw: true`.

          - **`true`** — Returns the brand regardless of its NSFW status.

          - **`false`** — Filters out all brands flagged as NSFW (returns `404`).'
        schema:
          type: boolean
      responses:
        '200':
          description: Successful request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Unauthorized
        '404':
          description: <Not Found> or <Invalid Domain Name>
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - <Not Found> or <Invalid Domain Name>
        '429':
          description: API key quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - API key quota exceeded
    servers:
    - url: https://api.brandfetch.io
