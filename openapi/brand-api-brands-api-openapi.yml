    head:
      summary: Check availability and prefetch a brand
      description: 'Tells you whether Brandfetch already holds the brand for a domain and, when it does not, queues a crawl so that the `GET` which follows is answered from our store instead of waiting on a live crawl. Available on paid plans. A `HEAD` request carries no body and never consumes a credit.


