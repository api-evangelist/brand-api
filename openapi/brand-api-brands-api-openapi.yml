openapi: 3.2.0
info:
  title: Brandfetch Brands API
  description: Our APIs help you personalize your customer journey through unique branded experiences.
  license:
    name: MIT
  version: 1.0.0
  contact:
    name: Brandfetch Support
    url: https://brandfetch.com
    email: support@brandfetch.io
servers:
- url: https://api.brandfetch.io
tags:
- name: Brands
paths:
  /v2/brands/{identifier}:
    get:
      summary: Get brand data
      description: 'Get brand data using a Domain, Website URL, Email address, Brand ID, ISIN, Stock/ETF ticker, or Crypto symbol. Authenticate with an API key sent as `Authorization: Bearer `, or pay for the single request with x402 or MPP: https://docs.brandfetch.com/agents/pay-per-request.'
      operationId: getBrandData
      tags:
      - Brands
      security:
      - bearerAuth: []
      - x402Payment: []
      - mppPayment: []
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.10'
        protocols:
        - x402: {}
        - mpp:
            method: tempo
            intent: charge
            currency: '0x20C000000000000000000000b9537d11c60E8b50'
        offers:
        - amount: '100000'
          currency: '0x20C000000000000000000000b9537d11c60E8b50'
          description: Brand API request
          intent: charge
          method: tempo
      parameters:
      - name: identifier
        in: path
        description: 'Identifier to retrieve brand data. Accepted formats:


          - **Domain:** `nike.com`

          - **Email address:** `john@example.brandfetch.com`

          - **Website URL:** `https://www.brandfetch.com/developers/pricing`

          - **Brand ID:** `id_0dwKPKT`

          - **Stock or ETF ticker:** `NKE`

          - **ISIN:** `US6541061031`

          - **Crypto symbol:** `BTC`, `ETH`


          **Note:** When using this generic endpoint, the identifier is resolved in the following order: `domain` → `ticker` → `isin` → `crypto`. To avoid naming collisions, use explicit type routes: `/v2/brands/{type}/{identifier}` where `type` can be `domain`, `ticker`, `isin`, or `crypto`.


          **Email addresses:** The API reads an identifier that contains `@` (or the percent-encoded `%40`) as an email address. It resolves the address to its registrable domain. `john@example.brandfetch.com` returns the same response as `brandfetch.com`. A mailbox provider''s address resolves like any other address: a gmail.com address returns the brand of gmail.com. The API does not tell you whether the domain is the contact''s company. A malformed address returns `400`, and the API does not bill the request. Refused lookups do not count against your quota. The API does not store the address. Your request logs show only the resolved domain. This endpoint and the Brand Context API accept email addresses. The explicit type routes refuse an email address with a `400`.


          **Website URLs:** The API reads an identifier that starts with `http://` or `https://` (or the percent-encoded `https%3A%2F%2F`) as a website URL. The API also reads a domain with a path (`brandfetch.com/developers/pricing`) as a website URL. The API resolves the URL to the registrable domain of its host. The scheme, `www.`, port, path, and query do not change the result. `https://www.brandfetch.com/developers/pricing` returns the same response as `brandfetch.com`. A URL whose host is not a domain name returns `400`, and the API does not bill the request. Refused lookups do not count against your quota. The API does not store the URL. Your request logs show only the resolved domain. This endpoint and the Brand Context API accept website URLs. The explicit type routes refuse a website URL with a `400`.'
        required: true
        schema:
          type: string
        examples:
          domain:
            summary: Domain
            value: nike.com
          email:
            summary: Email address
            value: john@example.brandfetch.com
          url:
            summary: Website URL
            value: https://www.brandfetch.com/developers/pricing
          brandId:
            summary: Brand ID
            value: id_0dwKPKT
          ISIN:
            summary: ISIN
            value: US6541061031
          stockSymbol:
            summary: Stock or ETF ticker
            value: NKE
          cryptoSymbol:
            summary: Crypto symbol
            value: BTC
      - name: allowNsfw
        in: query
        required: false
        description: 'Brandfetch evaluates brands for NSFW content and reserves the right to not return inappropriate brands. Depending on the severity, a brand may either not be returned at all (`404`), or be returned with its `isNsfw` property set to `true`. The `allowNsfw` query parameter lets you control this behavior:


          - **Not set** (default) — Some NSFW brands are not returned (`404`), others are returned with `isNsfw: true`.

          - **`true`** — Returns the brand regardless of its NSFW status.

          - **`false`** — Filters out all brands flagged as NSFW (returns `404`).'
        schema:
          type: boolean
      - name: cachedOnly
        in: query
        description: When `true`, the Brand API answers from its store alone. A brand that is already indexed is returned as usual, and a brand that is not is answered with `204 No Content` instead of being indexed live, which can take several seconds. Nothing is crawled, and a ticker, ISIN, or crypto symbol that is not yet indexed is not resolved either. A `204` does not count towards your quota. Any value other than `true`, including omitting the parameter, keeps the default behaviour of indexing the brand live on a miss. Defaults to `false`.
        required: false
        schema:
          type: boolean
          default: false
        examples:
          cachedOnly:
            summary: Cached only (skip crawling)
            value: true
      - name: palette
        in: query
        required: false
        description: 'Opt in to the brand''s color palette. Set `true` or `1` to add a `palette` object to the response. If you omit the parameter, or set another value, the response does not change and has no `palette` key.


          If the brand has no palette yet, this request builds one from the brand''s last crawl and can take some seconds longer.'
        schema:
          type: boolean
      responses:
        '200':
          headers:
            PAYMENT-RESPONSE:
              description: 'Present on responses paid with x402: the base64-encoded settlement receipt (`success`, `transaction`, `network`, `payer`).'
              schema:
                type: string
            Payment-Receipt:
              description: 'Present on responses paid with MPP: the base64url-encoded receipt (`method`, `reference`, `status`, `timestamp`). Such responses also carry `Cache-Control: private`.'
              schema:
                type: string
          description: 'Successful request. A request paid with MPP whose response was lost can be retried with the same credential for two minutes: it is served from the payment already taken and not charged again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '204':
          description: Returned when `cachedOnly=true` and the brand is not yet indexed. The response body is empty. Because live indexing is disabled there is nothing to return, and the request does not count towards your quota. Retry without `cachedOnly` to index the brand live.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
        '401':
          description: Unauthorized. Returned when the `Authorization` header is present but malformed. A request with no credential at all receives a `402` with a payment challenge instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Unauthorized
        '402':
          description: 'Payment required. Returned when the request carries no credential: no API key, no x402 payment, no MPP credential. The `PAYMENT-REQUIRED` header prices this request at $0.10 in USDC on Base, and each `WWW-Authenticate: Payment` challenge quotes the same price over MPP. Pay either way, or send an API key. Also returned, with a `reason`, when a `PAYMENT-SIGNATURE` or an `Authorization: Payment …` credential was presented but the payment was not accepted or could not be settled. Nothing is charged in that case. See https://docs.brandfetch.com/agents/pay-per-request.'
          headers:
            PAYMENT-REQUIRED:
              description: 'The x402 v2 payment challenge: base64-encoded JSON whose `accepts` array lists how to pay (scheme `exact`, network `eip155:8453`, the USDC asset, the `amount` in USDC''s six decimals and the receiving `payTo` address). Sign the payment with an x402 client and retry with the result in a `PAYMENT-SIGNATURE` header. See https://docs.brandfetch.com/agents/pay-per-request.'
              schema:
                type: string
            Cache-Control:
              description: '`no-store` — a challenge is issued for one request and must not be cached.'
              schema:
                type: string
            WWW-Authenticate:
              description: 'The MPP challenge: one `Payment` challenge for USDC.e on Tempo, which settles from a cent. Answer it with an `Authorization: Payment …` credential. Cards start at $0.50, above this price, so no card challenge is issued here; a card can pay for standing access on `POST /v2/agents/access`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaymentChallenge'
                - $ref: '#/components/schemas/PaymentRejected'
        '404':
          description: '<Not Found> or <Invalid Domain Name>. With `x-bf-error: crawl_queued`, we did not hold the brand yet and have started collecting it: retry the same request in a minute or two; if the brand could be collected, the retry is served it, and otherwise it answers an ordinary `404`, which a payment is charged for. Every `404` consumes an API credit. A payment presented with a `404` is settled, except when the response carries `x-bf-error: crawl_queued`: that payment is not charged, the body carries a `payment` object saying so, and the same payment can be presented again for the retry while it is still valid.'
          headers:
            x-bf-error:
              description: Present when the brand is being collected; a retry shortly after is usually served it.
              schema:
                type: string
                enum:
                - crawl_queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - <Not Found> or <Invalid Domain Name>
                  payment:
                    type: object
                    description: 'Present on a paid request answered with `x-bf-error: crawl_queued`.'
                    properties:
                      charged:
                        type: boolean
                        enum:
                        - false
                      documentation:
                        type: string
                        format: uri
                      message:
                        type: string
        '429':
          description: API key quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - API key quota exceeded
    head:
      summary: Check availability and prefetch a brand
      description: 'Tells you whether Brandfetch already holds the brand and, when it does not, queues a crawl so that the `GET` which follows is answered from our store instead of waiting on a live crawl. Available on paid plans. A `HEAD` request carries no body and never consumes a credit.


        - `200` — the brand is held. A `GET` answers from the store.

        - `202` — the brand is not held and a crawl has been queued. A `GET` made before the crawl finishes still crawls live.

        - `404` — nothing can be fetched for the identifier: an unknown brand ID, ticker, ISIN or crypto symbol, a domain without a public suffix, or a brand that has been removed.


        Prefetch requests may be throttled to prevent abuse and ensure quality of service. A typical use is warming a brand at signup: send the new user''s email address, and the brand is ready by the time you render it.'
      operationId: prefetchBrand
      tags:
      - Brands
      security:
      - bearerAuth: []
      parameters:
      - name: identifier
        in: path
        description: 'Same identifier formats as `GET /v2/brands/{identifier}`: domain, email address, brand ID, stock or ETF ticker, ISIN, or crypto symbol. Only a domain — or the registrable domain of an email address — can have a crawl queued for it; the other kinds answer `200` or `404`.'
        required: true
        schema:
          type: string
        examples:
          domain:
            summary: Domain
            value: nike.com
      responses:
        '200':
          description: The brand is held. A `GET` answers from the store.
          headers:
            x-api-key-quota:
              description: Your organization's API credit quota for the current period. The check itself consumes no credit.
              schema:
                type: integer
            x-api-key-approximate-usage:
              description: Credits used so far this period. Usage is counted asynchronously, so the figure trails your latest requests slightly.
              schema:
                type: integer
        '202':
          description: The brand is not held; a crawl has been queued.
          headers:
            x-api-key-quota:
              description: Your organization's API credit quota for the current period. The check itself consumes no credit.
              schema:
                type: integer
            x-api-key-approximate-usage:
              description: Credits used so far this period. Usage is counted asynchronously, so the figure trails your latest requests slightly.
              schema:
                type: integer
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Your organization is not on a paid plan.
          headers:
            x-bf-error:
              description: Why the request was refused.
              schema:
                type: string
                enum:
                - paid_plan_required
        '404':
          description: 'Nothing can be fetched for the identifier: it is unknown, or its brand has been removed.'
        '429':
          description: Request throughput limit exceeded. The check never consumes your quota, so this is the platform rate limit rather than your allowance.
        '503':
          description: The crawl request could not be queued. Retry later.
          headers:
            x-bf-error:
              description: Why the request was refused.
              schema:
                type: string
                enum:
                - temporarily_unavailable
