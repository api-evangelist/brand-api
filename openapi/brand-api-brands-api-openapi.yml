    post:
      summary: Get brand data from a transaction
      description: 'Turn payment transactions into merchant data. Authenticate with an API key sent as `Authorization: Bearer `, or pay for the single request with x402 or MPP: https://docs.brandfetch.com/agents/pay-per-request.'
      operationId: getBrandFromTransaction
