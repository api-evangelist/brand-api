        offers:
        - amount: '100000'
          currency: '0x20C000000000000000000000b9537d11c60E8b50'
          description: Transaction API request
          intent: charge
          method: tempo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionLabel:
                  type: string
                  description: The raw transaction text.
                  example: STARBUCKS 1523 OMAHA NE
                countryCode:
                  type: string
                  description: An ISO 3166-1 alpha-2 country code indicating the country where the transaction took place.
                  example: US
              required:
              - transactionLabel
              - countryCode
      responses:
        '200':
          headers:
            PAYMENT-RESPONSE:
              description: 'Present on responses paid with x402: the base64-encoded settlement receipt (`success`, `transaction`, `network`, `payer`).'
              schema:
                type: string
            Payment-Receipt:
              description: 'Present on responses paid with MPP: the base64url-encoded receipt (`method`, `reference`, `status`, `timestamp`). Such responses also carry `Cache-Control: private`.'
              schema:
                type: string
          description: 'Successful request. A request paid with MPP whose response was lost can be retried with the same credential and the same body for two minutes: it is served from the payment already taken and not charged again. The credential pays for that transaction only: presented with another `transactionLabel` or `countryCode`, it is refused with a `402` whose `reason` is `credential_spent`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '400':
          description: 'Either the request was malformed, or the descriptor could not be confidently matched to a merchant. A malformed request is a missing or empty `transactionLabel` or `countryCode`, or a `countryCode` that names no country; the message names the offending field. A descriptor that could not be matched carries `reason: low_confidence` and the message `We couldn''t match this transaction to a brand with enough confidence. Retrying won''t change the result; a more complete merchant descriptor may.` A `countryCode` that names no country carries `reason: invalid_country`. Retrying does not change either case, so fall back to showing the raw descriptor. For a temporary failure on our side, which is worth retrying, see `503`. Neither case is charged: it consumes no API credit, and a payment presented with it is not settled. A malformed body is answered `400` whatever credential the request carries, and a request without a credential is quoted a price only once its body is complete.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: We couldn't match this transaction to a brand with enough confidence. Retrying won't change the result; a more complete merchant descriptor may.
                  reason:
                    type: string
                    enum:
                    - low_confidence
                    - invalid_country
                    description: 'Why the request was refused, when it was not for a missing or empty field: `low_confidence` when the descriptor could not be confidently matched to a merchant, `invalid_country` when `countryCode` names no country.'
                    example: low_confidence
        '401':
          description: Unauthorized. Returned when the `Authorization` header is present but malformed. A request with no credential at all receives a `402` with a payment challenge instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Unauthorized
        '402':
          description: 'Payment required. Returned when the request carries no credential: no API key, no x402 payment, no MPP credential. The `PAYMENT-REQUIRED` header prices this request at $0.10 in USDC on Base, and each `WWW-Authenticate: Payment` challenge quotes the same price over MPP. Pay either way, or send an API key. Also returned, with a `reason`, when a `PAYMENT-SIGNATURE` or an `Authorization: Payment …` credential was presented but the payment was not accepted or could not be settled. Nothing is charged in that case. See https://docs.brandfetch.com/agents/pay-per-request.'
          headers:
            PAYMENT-REQUIRED:
              description: 'The x402 v2 payment challenge: base64-encoded JSON whose `accepts` array lists how to pay (scheme `exact`, network `eip155:8453`, the USDC asset, the `amount` in USDC''s six decimals and the receiving `payTo` address). Sign the payment with an x402 client and retry with the result in a `PAYMENT-SIGNATURE` header. See https://docs.brandfetch.com/agents/pay-per-request.'
              schema:
                type: string
            Cache-Control:
              description: '`no-store` — a challenge is issued for one request and must not be cached.'
              schema:
                type: string
            WWW-Authenticate:
              description: 'The MPP challenge: one `Payment` challenge for USDC.e on Tempo, which settles from a cent. It is issued for the transaction the request body names, so answer it with an `Authorization: Payment …` credential and send the same body again. Cards start at $0.50, above this price, so no card challenge is issued here; a card can pay for standing access on `POST /v2/agents/access`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaymentChallenge'
                - $ref: '#/components/schemas/PaymentRejected'
        '404':
          description: 'Not Found. The transaction label was matched to a domain, but there is no brand data to return for it. Like a `200`, it consumes an API credit. A payment presented with it is settled, except when the response carries `x-bf-error: crawl_queued`. That header means we did not hold the brand yet and have started collecting it: retry the same request in a minute or two; if the brand could be collected, the retry is served it, and otherwise it answers an ordinary `404`, which a payment is charged for. A paid request answered this way is not charged, and its body carries a `payment` object saying so; the same payment can be presented again for the retry while it is still valid.'
          headers:
            x-bf-error:
              description: Present when the brand is being collected; a retry shortly after is usually served it.
              schema:
                type: string
                enum:
                - crawl_queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not Found
                  payment:
                    type: object
                    description: 'Present on a paid request answered with `x-bf-error: crawl_queued`.'
                    properties:
                      charged:
                        type: boolean
                        enum:
                        - false
                      documentation:
                        type: string
                        format: uri
                      message:
                        type: string
        '429':
          description: API key quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - API key quota exceeded
        '503':
          description: 'Brandfetch was temporarily unable to process the request. The request itself was valid, so retrying it is safe and may succeed. An enrichment `503` never consumes an API credit, and a payment presented with it is not settled. A `503` with `Retry-After` on a paid request comes from the payment service instead: it could not be reached, or, after an MPP credential, whether the payment went through is not known yet. Retry after the interval; after an MPP credential, retry the exact request with the same credential, and a payment that went through is not charged twice. See https://docs.brandfetch.com/agents/pay-per-request. This is distinct from a `400` saying the transaction could not be matched to a brand with enough confidence: retrying that returns the same answer.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Transaction enrichment is temporarily unavailable. Please retry.
  /v2/brands/batch:
    post:
      summary: Get up to 100 brands in one request
      description: 'Send up to 100 identifiers. Get one result per identifier, in the order you sent them. Each identifier is answered the way `GET /v2/brands/{identifier}` answers it.


        One difference: a batch never crawls while you wait. A brand that is not indexed yet is queued for indexing and answered `202`. Request it again later.


        Each identifier answered `200` uses one API credit. Every other result is free, `404` included. An identifier repeated in one request is charged once.


        Available on paid plans and with prepaid credits. Authenticate with an API key sent as `Authorization: Bearer `.'
      operationId: getBrandBatch
      tags:
      - Brands
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - identifiers
              properties:
                identifiers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: 'The brands to look up. A string is read as the `identifier` of `GET /v2/brands/{identifier}`: a domain, website URL, email address, brand ID, ticker or ISIN. An object names the identifier''s type, as `GET /v2/brands/{type}/{identifier}` does. An exchange-suffixed ticker sent as a string, such as `bhp.ax`, is read as a domain: send it as `{ "type": "ticker", "value": "BHP.AX" }`.'
                  items:
                    oneOf:
                    - type: string
                      minLength: 1
                      maxLength: 2048
                      example: nike.com
                    - type: object
                      additionalProperties: false
                      required:
                      - type
                      - value
                      properties:
                        type:
                          type: string
                          enum:
                          - domain
                          - ticker
                          - isin
                          - crypto
                          - brandId
                        value:
                          type: string
                          minLength: 1
                          maxLength: 2048
                      example:
                        type: ticker
                        value: NKE
                  example:
                  - nike.com
                  - https://www.spotify.com/about
                  - type: ticker
                    value: NKE
                cachedOnly:
                  type: boolean
                  default: false
                  description: Answer from the index alone. A brand that is not indexed is answered `204` and is not queued, and a ticker, ISIN or crypto symbol that is not indexed is not resolved. A `204` is free.
                allowNsfw:
                  type: boolean
                  description: As `allowNsfw` on `GET /v2/brands/{identifier}`. Not set by default.
                palette:
                  type: boolean
                  default: false
                  description: 'As `palette` on `GET /v2/brands/{identifier}`: add each brand''s `palette`.'
      responses:
        '200':
          description: One result per identifier, in the order you sent them.
          headers:
            x-api-key-quota:
              description: Your organization's API credit quota for the current period.
              schema:
                type: integer
            x-api-key-approximate-usage:
              description: Credits used this period, including the ones this request uses. Usage is counted asynchronously, so the figure trails your latest requests slightly.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - identifier
                      - status
                      properties:
                        identifier:
                          description: The identifier you sent, with surrounding whitespace removed.
                          oneOf:
                          - type: string
                          - type: object
                        status:
                          type: integer
                          enum:
                          - 200
                          - 202
                          - 204
                          - 400
                          - 404
                          - 413
                          - 500
                          - 504
                          description: '- `200` — `brand` holds the brand.

                            - `202` — the brand is not indexed yet and is queued for indexing (`code`: `crawl_queued`). Request it again later. Free.

                            - `204` — with `cachedOnly`, the brand is not indexed. Nothing is queued. Free.

                            - `400` — not a valid identifier. `message` says why. Free.

                            - `404` — no brand can be returned for the identifier. `message` gives the reason. Free.

                            - `413` — the brand did not fit in this response (`code`: `response_too_large`). Request it again in a smaller batch. Free.

                            - `500` — the identifier could not be looked up. Request it again. Free.

                            - `504` — the identifier could not be looked up in time (`code`: `timeout`). Request it again. Free.'
                        brand:
                          $ref: '#/components/schemas/BrandResponse'
                        code:
                          type: string
                          enum:
                          - crawl_queued
                          - response_too_large
                          - timeout
                        message:
                          type: string
        '400':
          description: 'The request body is malformed: `identifiers` is missing, empty or longer than 100, an item is neither a string nor a `{ type, value }` object, or the body has a property the API does not take. `message` names the problem. Nothing is charged.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: No API key was sent, or the `Authorization` header is malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: 'The API key is unknown or revoked, or your organization has no API credits. With `x-bf-error: paid_plan_required`, your organization is on the free plan and holds no prepaid credits.'
          headers:
            x-bf-error:
              description: Why the request was refused.
              schema:
                type: string
                enum:
                - paid_plan_required
        '429':
          description: Your organization has fewer API credits left than this request could use. `required` is the number of identifiers that could be charged. `remaining` is what is left. Send fewer identifiers, or add credits. Nothing is charged. The same status is returned when the request throughput limit is exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not enough API credits remain for this batch.
                  quota:
                    type: integer
                  used:
                    type: integer
                  remaining:
                    type: integer
                  required:
                    type: integer
components:
  schemas:
    PaletteTheme:
      type: object
      description: One theme of the brand's website. Each slot holds a color that the render of this theme showed. A slot that the render did not show is `null`. Every color is also an entry in `colors[]`.
      properties:
        background:
          type: string
          description: The page background color HEX code.
        surface:
          type:
          - string
          - 'null'
          description: The color HEX code of cards and panels on the page background.
        text:
          type: string
          description: The body text color HEX code.
        muted:
          type:
          - string
          - 'null'
          description: The color HEX code of secondary text.
        border:
          type:
          - string
          - 'null'
          description: The color HEX code of borders and dividers.
        accent:
          type:
          - string
          - 'null'
          description: The color HEX code of links and buttons in this theme.
        contrast:
          type: number
          description: WCAG contrast ratio between `background` and `text`.
    PaymentChallenge:
      type: object
      description: 'Body of the 402 an unauthenticated request receives when the route can be paid for per request. The machine-readable challenges are in the `PAYMENT-REQUIRED` header for x402 and the `WWW-Authenticate: Payment` header for MPP; this body says the same in prose.'
      properties:
        message:
          type: string
          example: 'Payment required. Either authenticate with a Brandfetch API key (Authorization: Bearer <key>) or pay for this request with x402: sign the payment described in the PAYMENT-REQUIRED header and retry with a PAYMENT-SIGNATURE header.'
        documentation:
          type: string
          example: https://docs.brandfetch.com/agents/pay-per-request
        pricing:
          type: object
          properties:
            route:
              type: string
              example: GET /v2/brands/*
            price:
              type: string
              example: $0.10
        resource:
          type: string
          description: The URL the payment is for.
          example: https://api.brandfetch.io/v2/brands/nike.com
        standingAccess:
          type: string
          example: For many requests, POST /v2/agents/access (paid the same way) provisions an API key preloaded with prepaid credits.
    Format:
      type: object
      properties:
        src:
          type: string
          description: File source
        format:
          type: string
          enum:
          - svg
          - webp
          - png
          - jpeg
          description: File format
        height:
          type:
          - integer
          - 'null'
          description: File height in pixels
        width:
          type:
          - integer
          - 'null'
          description: File width in pixels
        size:
          type: integer
          description: File size in bytes
        background:
          type:
          - string
          - 'null'
          enum:
          - transparent
          description: Indicates if the file has a transparent background
    Industry:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the industry
        score:
          type: number
          format: float
          description: Probability, between 0 and 1, that the brand belongs to this industry. A value of 1 marks an industry that was set rather than predicted, for example by a curator, an import or a content rule.
        slug:
          type: string
          description: URL friendly identifier
        name:
          type: string
          description: Name of the industry
        emoji:
          type: string
          description: An emoji for the industry
        parent:
          description: If the object is a sub-category, the parent industry
          items:
            $ref: '#/components/schemas/IndustryParent'
    PaymentRejected:
      type: object
      description: 'Body of the 402 a request carrying a `PAYMENT-SIGNATURE`, or an `Authorization: Payment …` credential, receives when the payment was not accepted or could not be settled. The resource was not served. Nothing was charged, so pay afresh and retry, unless the `message` says to retry the exact request first (a refused settlement of a standing-access purchase).'
      properties:
        message:
          type: string
          example: The payment was not accepted, so the request was not served and nothing was charged. Sign a new payment for the PAYMENT-REQUIRED header and retry.
        reason:
          type: string
          description: 'The payment service''s reason code, e.g. `insufficient_funds`. An MPP credential adds `credential_spent` (it already paid for a request), `credential_in_use` (another request is settling it; retry this exact request in a moment) `credential_malformed` (it could not be read) and `challenge_invalid` (it answers a challenge this API did not issue; answer a fresh one). A Tempo transaction that cannot complete adds `nonce_already_used`, `transaction_rejected`, `transaction_reverted` and `transaction_expired`: the transfer did not happen, so answer a fresh challenge.'
          example: insufficient_funds
        documentation:
          type: string
          example: https://docs.brandfetch.com/agents/pay-per-request
    BrandResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the brand
        name:
          type:
          - string
          - 'null'
          description: Brand name
        domain:
          type: string
          description: Brand website URL
        claimed:
          type: boolean
          description: Set to true if the owner of the brand claimed its brand profile on [Brandfetch](https://brandfetch.com)
        description:
          type:
          - string
          - 'null'
          description: Brand description
        longDescription:
          type:
          - string
          - 'null'
          description: Brand long description
        links:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the social media platform
                enum:
                - twitter
                - facebook
                - instagram
                - github
                - youtube
                - linkedin
                - crunchbase
              url:
                type: string
                description: URL of the social media profile
          description: Social media links of the brand
        logos:
          type: array
          items:
            type: object
            properties:
              theme:
                type:
                - string
                - 'null'
                description: 'See logo theme. Possible values:

                  - **dark**: A dark logo should be displayed on a light background (e.g. #ffffff)

                  - **light**: A light logo should be displayed on a dark background (e.g. #000000)'
                enum:
                - dark
                - light
                - null
              formats:
                type: array
                items:
                  $ref: '#/components/schemas/Format'
                description: A list of format objects containing files in different formats
              tags:
                type: array
                items:
                  type: string
                description: 'What the image is. Brandfetch tags a brand''s icon and logo; one that is no longer the brand''s main icon or logo keeps its tags and is listed with type `other`. Possible values:

                  - **photographic**: The image is a photograph, or a logo shown on one, such as a sign or a vehicle.

                  - **portrait**: The image is a photograph mainly of one or more people. An image tagged `portrait` is also tagged `photographic`.

                  - **illustration**: The image is a drawing, painting, cartoon or 3D render that is not a logo.

                  - **screenshot**: The image is a screenshot or mockup of software, a website, an app or a device screen. Logos only.

                  - **text**: The image is a flyer, poster, advert, social media post, infographic, document or menu.

                  - **placeholder**: The image is a default avatar, a blank or single-colour image, or a "no image" graphic.

                  - **wordmark**: The logo is the brand''s name set in type, with no separate symbol.

                  - **lettermark**: The logo is initials, a monogram or a single letter. Icons only.

                  - **symbol**: The logo is a symbol alone, without text. Icons only.

                  - **combination**: The logo pairs a symbol with the name.

                  - **emblem**: The logo''s text sits inside a badge, seal or crest.


                  The mark types, `wordmark` to `emblem`, go only on an image that is mainly a logo, one at most. A tag is assigned only when the image clearly is one, so an image without a tag can still be any of these. Logos and icons that Brandfetch has not refreshed since October 2026 may carry fewer tags, or none. Brandfetch may add values.'
              type:
                type: string
                description: 'See logo type. Possible values:

                  - **icon**: The icon that is used on social profiles (e.g. [Tesla''s social icon](https://cdn.brandfetch.io/tesla.com/icon))

                  - **logo**: The horizontal logo, seen on large surfaces (e.g. [Tesla''s logo](https://asset.brandfetch.io/id2S-kXbuK/idAJ5NMLPG.svg))

                  - **symbol**: The universal mark that abstractly represents the brand (e.g. [Tesla''s T symbol](https://asset.brandfetch.io/id2S-kXbuK/idM-t614MT.svg))

                  - **other**: Other is used to refer to any type of logo that is not the primary one. (e.g. Amazon Kindle Logo)'
                enum:
                - icon
                - logo
                - symbol
                - other
          description: Logos, symbols & icons of the brand
        colors:
          type: array
          items:
            type: object
            properties:
              hex:
                type: string
                description: Color HEX code
              type:
                type: string
                description: 'Type of the color. Possible values:

                  - **accent**: The main color that represents the brand (used to draw attention e.g. call to action button)

                  - **dark**: The darker color of the brand (used for surfaces or backgrounds)

                  - **light**: The lighter color of the brand (used for surfaces or backgrounds)

                  - **brand**: The full-color scheme of the brand (used to create color palettes users can pick from)'
                enum:
                - accent
                - dark
                - light
                - brand
              brightness:
                type: number
                description: Color brightness. Calculated based on the standard formula 0.2126*R + 0.7152*G + 0.0722*B
                format: float
          description: Accent, dark, light & palette colors of the brand
        fonts:
          type: array
          items:
            type: object
            properties:
              name:
                type:
                - string
                - 'null'
                description: Font family
              type:
                type: string
                description: Font type
                enum:
                - title
                - body
              origin:
                type: string
                description: 'See font origin. Possible values:

                  - **google**: The font that''s hosted on Google Font

                  - **custom**: The font that has been uploaded by the brand itself

                  - **system**: The font that''s already installed on the user''s operating system (see example)'
                enum:
                - google
                - custom
                - system
              originId:
                type:
                - string
                - 'null'
                description: Font origin ID
              weights:
                type: array
                items:
                  type: object
                  properties: {}
          description: Title & body fonts of the brand
        images:
          type: array
          items:
            type: object
            properties:
              formats:
                type: array
                items:
                  $ref: '#/components/schemas/Format'
                description: Available formats of the image
              tags:
                type: array
                items:
                  type: string
                description: 'What the image is. A banner that is no longer the brand''s main one keeps its tags and is listed with type `other`. Possible values:

                  - **photographic**: The image is a photograph, or a logo shown on one. Banners and pictures.

                  - **portrait**: The image is a photograph mainly of one or more people. Banners and pictures. An image tagged `portrait` is also tagged `photographic`.

                  - **illustration**: The image is a drawing, painting, cartoon or 3D render that is not a logo. Banners and pictures.

                  - **screenshot**: The image is a screenshot or mockup of software, a website, an app or a device screen. Pictures.

                  - **text**: The image is a flyer, poster, advert, social media post, infographic, document or menu. Banners and pictures.

                  - **pattern**: The image is an abstract background, texture, gradient or pattern with no subject. Pictures.

                  - **placeholder**: The image is blank, a single colour, or a "no image" graphic. Banners.


                  A tag is assigned only when the image clearly is one, so an image without a tag can still be any of these. Images that Brandfetch has not refreshed since October 2026 have no tags. Brandfetch may add values.'
              type:
                type: string
                description: Image type. `picture` entries are images published on the brand's own site and carry `pictureMetadata`. Their `tags` say what each one is, such as a photograph, a screenshot or a flyer.
                enum:
                - banner
                - other
                - picture
              pictureMetadata:
                type: object
                description: Present on `picture` entries only. Lets you choose between a brand's pictures without fetching the files first.
                properties:
                  score:
                    type: number
                    description: How representative of the brand we consider this picture
                  rank:
                    type: integer
                    description: Position of this picture among the brand's pictures, by descending score
                  naturalWidth:
                    type: integer
                    description: Intrinsic width of the image in pixels
                  naturalHeight:
                    type: integer
                    description: Intrinsic height of the image in pixels
                  alt:
                    type: string
                    description: Alt text published with the image on the brand's site
                  sourceUrl:
                    type: string
                    description: URL of the image on the brand's own site. A `picture` can arrive with an empty `formats` array, in which case this is how you reach the image.
                  imageCategory:
                    type:
                    - string
                    - 'null'
                    description: Category we classified the image into
                  categoryConfidence:
                    type:
                    - number
                    - 'null'
                    description: Confidence in the assigned `imageCategory`
          description: Banner, picture & other images of the brand
        qualityScore:
          type: number
          description: 'Score between 0-1 which indicates the quality of the data for the given brand. Useful when you don''t want to show lower quality brands to your users.


            Lower 3rd is poor quality, middle 3rd is OK quality, upper 3rd is high quality. Lower scores indicate that a brand is less likely to be "real". For example, where google.com will score high, my-random-blog.com will score between 0.3-0.4. The score factors in things like data-recency, whether the brand has been claimed, if it has been manually verified by our team, the brand''s domain ranking on the web, as well as other factors.


            Don''t rely on a fixed score for any given brand. The way we calculate this score may change over time as we add new factors, or tweak the weights of existing ones such that a score for a given brand may change. However, they will remain aligned such that scores divide quality into thirds: low, medium, high.'
        company:
          type: object
          properties:
            employees:
              type:
              - integer
              - 'null'
              description: 1 employee, 2-10 employees, 11-50 employees, 51-200 employees, 201-500 employees, 501-1,000 employees, 1,001-5,000 employees, 5,001-10,000 employees, 10,001+ employees
              enum:
              - 1
              - 2
              - 11
              - 51
              - 201
              - 501
              - 1001
              - 5001
              - 10001
            financialIdentifiers:
              type:
              - object
              - 'null'
              description: Object holding financial identifiers
              properties:
                isin:
                  type: array
                  description: List of ISIN codes
                  items:
                    type: string
                ticker:
                  type: array
                  description: List of Stock or ETF ticker
                  items:
                    type: string
            foundedYear:
              type:
              - integer
              - 'null'
              description: The year the brand was founded
            industries:
              type: array
              items:
                $ref: '#/components/schemas/Industry'
              description: An array of industries, sorted by descending `score`. A sub-industry carries its top-level industry in `parent`. See the full list of industries [here](https://docs.google.com/spreadsheets/d/1N44nMfVtPCFM4ebTcmRlqbyxjFtDAGVuqd0mh0dcOU0/edit?usp=sharing)
            kind:
              type:
              - string
              - 'null'
              description: Organizational Structure
              enum:
              - EDUCATIONAL
              - GOVERNMENT_AGENCY
              - NON_PROFIT
              - PARTNERSHIP
              - PRIVATELY_HELD
              - PUBLIC_COMPANY
              - SELF_EMPLOYED
              - SELF_OWNED
            location:
              $ref: '#/components/schemas/Location'
          description: The company object returns firmographic data related to the brand
        isNsfw:
          type: boolean
          description: true when the brand is for adult content, e.g. is not safe for work
        urn:
          type: string
          description: Uniform Resource Name for the brand
        palette:
          type:
          - object
          - 'null'
          description: The brand's color palette. Present only when the request sets `palette=true` or `palette=1`. When a brand has no palette yet, the first request builds one from the brand's last crawl without a new render. Then `themes` and `onPairs` can be empty until the next crawl. When Brandfetch finds no color that it can defend as the brand's color, no color has the role `primary`.
          properties:
            colors:
              type: array
              items:
                type: object
                properties:
                  hex:
                    type: string
                    description: Color HEX code.
                  name:
                    type:
                    - string
                    - 'null'
                    description: Name of the closest named color. Uses the same list as `colors[].name`, so the same HEX code has the same name everywhere.
                  role:
                    type: string
                    description: 'What the color does for the brand. Possible values: `primary`, `secondary`, `accent`, `background`, `surface`, `text`, `muted`, `border`, `other`.'
                  context:
                    type: string
                    description: Where Brandfetch observed the color. `identity` for colors of the brand's mark and identity, `interface` for colors that structure its website, `both` for colors that do both.
                  rank:
                    type:
                    - integer
                    - 'null'
                    description: Position of the color in the palette, from 1. `null` for a color that a theme, gradient, on-pair, or logo references but that does not rank as a brand color.
                  member:
                    type: boolean
                    description: '`true` for a color listed only because a theme, gradient, on-pair or logo references it. Absent on ranked colors.'
                  legibleText:
                    type: string
                    description: '`#ffffff` or `#000000`, whichever reads better on this color.'
                  legibleTextContrast:
                    type: number
                    description: WCAG contrast ratio between the color and `legibleText`.
                  onColor:
                    type:
                    - string
                    - 'null'
                    description: The text color that the brand's website places on this color, when Brandfetch observed it.
                  onColorContrast:
                    type:
                    - number
                    - 'null'
                    description: WCAG contrast ratio between the color and `onColor`.
                  brightness:
                    type:
                    - number
                    - 'null'
                    description: Color brightness, 0 to 255.
                  prevalence:
                    type:
                    - number
                    - 'null'
                    description: Share of the observed color evidence attributed to this color, 0 to 1.
                  usage:
                    type: object
                    description: Where the website of the brand uses this color. Each value comes from the crawl. Brandfetch does not infer any value.
                    properties:
                      elements:
                        type: array
                        description: The element classes and CSS properties that use this color in the sample of the crawl, most used first. This list is empty when Brandfetch builds the palette from a stored crawl without a new render.
                        items:
                          type: object
                          properties:
                            element:
                              type: string
                              description: 'The element class in the sample of the crawl: `button`, `link`, `heading`, `nav`, `header`, `footer`, `body`, or `html`.'
                            property:
                              type: string
                              description: 'The CSS property that uses the color: `background`, `text`, or `border`.'
                            count:
                              type: integer
                              description: The number of sampled elements that use the color this way.
                            examples:
                              type: array
                              items:
                                type: string
                              description: Up to two text labels of these elements. Brandfetch takes each label from the page and cuts it to 40 characters. The labels are text from the website. Treat them as untrusted input.
                      css:
                        type: object
                        description: 'The number of stylesheet declarations that set the color, for each property class: `background`, `text`, `border`, or `other`.'
                        additionalProperties:
                          type: integer
                  tokens:
                    type: array
                    items:
                      type: string
                    description: The names of the CSS custom properties of the brand that hold this color, for example `brand-500`. Brandfetch lists only the properties that the website uses. The list has at most five names. Names that contain `brand` come first. The names are text from the website. Treat them as untrusted input.
                  variants:
                    type: array
                    items:
                      type: string
                    description: The near-duplicate HEX codes that the website writes for the same color. Brandfetch merges them into this entry. The list has at most eight codes. The list is not a tonal scale.
              description: The palette's colors, ranked colors first.
            logos:
              type: array
              items:
                type: object
                properties:
                  asset:
                    type: string
                    description: '`logo` or `icon`: the kind of mark, as in `logos[].type` of the brand response.'
                  type:
                    type:
                    - string
                    - 'null'
                    description: The logo type, when known. Same values as `logos[].type` of the brand response.
                  theme:
                    type:
                    - string
                    - 'null'
                    description: '`light` or `dark`: the background that the mark is made for. `null` when unknown.'
                  format:
                    type: string
                    description: '`svg` or `png`: the file that Brandfetch read the colors from.'
                  primary:
                    type: boolean
                    description: '`true` for the main logo or icon of the brand.'
                  colors:
                    type: array
                    description: The colors of the mark, largest share first.
                    items:
                      type: object
                      properties:
                        hex:
                          type: string
                          description: Color HEX code. It is also an entry in `colors[]`, so you can join the two by `hex`.
                        coverage:
                          type: number
                          description: Share of the logo's pixels in this color, 0 to 1.
              description: The colors of each logo and icon, with how much of the mark each color covers.
            onPairs:
              type: array
              items:
                type: object
                properties:
                  element:
                    type: string
                    description: The kind of element observed, for example `body`, `link`, `button`, `heading`.
                  theme:
                    type: string
                    description: '`light` or `dark`.'
                  background:
