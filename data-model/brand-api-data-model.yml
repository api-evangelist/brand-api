  - {from: Brand, to: Format, kind: has_many, via: images, binding: array-of-objects}
  - {from: Brand, to: 'Link', kind: has_many, via: links, binding: array-of-objects,
     note: 'social media links; inline, no component schema'}
  - {from: Brand, to: 'Color', kind: has_many, via: colors, binding: array-of-objects,
     note: 'accent, dark, light and palette colors; inline, no component schema'}
  - {from: Brand, to: 'Font', kind: has_many, via: fonts, binding: array-of-objects,
     note: 'title and body fonts; inline, no component schema'}
  - {from: BrandContext, to: BrandContextMeta, kind: has_one, via: meta, binding: $ref}
  - {from: BrandContext, to: BrandContextIdentity, kind: has_one, via: identity, binding: $ref}
  - {from: BrandContext, to: BrandContextPositioning, kind: has_one, via: positioning, binding: $ref}
  - {from: BrandContext, to: BrandContextBrand, kind: has_one, via: brand, binding: $ref}
  - {from: BrandContextPositioning, to: BrandContextTargetAudience, kind: has_many, via: target_audience, binding: $ref}
  - {from: BrandContextPositioning, to: BrandContextProductOrService, kind: has_many, via: products_and_services, binding: $ref}
  - {from: BrandContextBrand, to: BrandContextVoice, kind: has_one, via: voice, binding: $ref}
  - {from: BrandContextBrand, to: BrandContextStyle, kind: has_one, via: style, binding: $ref}
  - {from: ApiKey, to: Organization, kind: belongs_to, via: organization, binding: inline-object}
  - {from: BrandContext, to: Brand, kind: references, via: 'meta.domain', binding: soft-key,
     note: 'Both are keyed by domain; there is no id-level join between them.'}
