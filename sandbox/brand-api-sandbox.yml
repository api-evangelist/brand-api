test_live_separation: false
note: >-
  Brandfetch ships NO sandbox in the payments sense: there is no test mode, no test/live
  key prefix pair, no fixture or trigger tooling, no test clock, and no magic test
  identifiers. There is nothing to simulate — the API returns public brand data, so every
  call is a live call against real data. What it does provide is an interactive console
  in the docs and a free tier generous enough to develop against. Recorded here so the
  absence is a measured fact rather than a gap.
